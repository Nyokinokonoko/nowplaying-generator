<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NowPlaying Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="app-nav">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </span>
            NowPlaying Generator
        </div>
        <div class="nav-right">
            <span class="version-pill">v1.4.0</span>
            <a href="https://github.com/Nyokinokonoko/nowplaying-generator" target="_blank" rel="noopener" class="icon-link" title="View on GitHub" aria-label="View on GitHub">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.73.5.5 5.73.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56 0-.28-.01-1.02-.02-2-3.2.69-3.88-1.54-3.88-1.54-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.71.08-.71 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.56-.29-5.26-1.28-5.26-5.71 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 2.9-.39c.98 0 1.97.13 2.9.39 2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.44-2.71 5.42-5.28 5.7.41.36.78 1.08.78 2.18 0 1.57-.01 2.84-.01 3.23 0 .31.21.68.8.56A10.52 10.52 0 0 0 23.5 12C23.5 5.73 18.27.5 12 .5Z"/></svg>
            </a>
        </div>
    </nav>

    <div class="app-shell">
        <div class="workspace">
            <!-- Left Panel: Controls -->
            <div class="card card-pad">
                <!-- Global Settings -->
                <div class="section">
                    <p class="section-label">Header</p>
                    <div class="field">
                        <label class="field-label" for="imageTitle">Title</label>
                        <input type="text" class="input" id="imageTitle" value="MAIN TITLE">
                    </div>
                    <div class="field">
                        <label class="field-label" for="imageSubtitle">Subtitle</label>
                        <input type="text" class="input" id="imageSubtitle" value="Subtitle text here">
                    </div>
                    <div class="field">
                        <label class="toggle">
                            <input type="checkbox" id="noCoverMode">
                            <span class="toggle-track"></span>
                            <span class="toggle-text">No-Cover Mode (2 Columns)</span>
                        </label>
                    </div>
                </div>

                <!-- Appearance -->
                <div class="section">
                    <p class="section-label">Appearance</p>
                    <div class="swatch-grid">
                        <div class="swatch">
                            <input type="color" id="colorBackground" value="#0d0e12" title="Background Color">
                            <span class="swatch-label">Background</span>
                        </div>
                        <div class="swatch">
                            <input type="color" id="colorOverlay" value="#05060a" title="Overlay Gradient Base">
                            <span class="swatch-label">Overlay Base</span>
                        </div>
                        <div class="swatch">
                            <input type="color" id="colorTitle" value="#FFFFFF" title="Title Color">
                            <span class="swatch-label">Title</span>
                        </div>
                        <div class="swatch">
                            <input type="color" id="colorSubtitle" value="#B9B9C6" title="Subtitle Color">
                            <span class="swatch-label">Subtitle</span>
                        </div>
                        <div class="swatch">
                            <input type="color" id="colorSongText" value="#F4F4F6" title="Song Number & Title">
                            <span class="swatch-label">Song Text</span>
                        </div>
                        <div class="swatch">
                            <input type="color" id="colorComment" value="#9A9AA6" title="Song Comment">
                            <span class="swatch-label">Comment</span>
                        </div>
                    </div>
                </div>

                <!-- Images -->
                <div class="section">
                    <p class="section-label">Images</p>
                    <div class="field">
                        <label class="field-label">Cover Art (Square)</label>
                        <div class="drop-zone" id="coverDropZone">
                            <span class="dz-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            </span>
                            <p class="dz-text">Drag &amp; drop or click</p>
                            <input type="file" accept="image/*" id="coverInput">
                            <img id="coverPreview" class="drop-zone-preview" alt="Cover preview">
                        </div>
                    </div>
                    <div class="field">
                        <label class="field-label">Backdrop (1920&times;1080)</label>
                        <div class="drop-zone" id="backdropDropZone">
                            <span class="dz-icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                            </span>
                            <p class="dz-text">Drag &amp; drop or click</p>
                            <input type="file" accept="image/*" id="backdropInput">
                            <img id="backdropPreview" class="drop-zone-preview" alt="Backdrop preview">
                        </div>
                    </div>
                </div>

                <!-- Song List -->
                <div class="section">
                    <div class="list-head">
                        <p class="section-label">Song List</p>
                        <div class="list-actions">
                            <button class="btn btn-icon" id="toggleCollapseBtn" title="Collapse/Expand All" aria-label="Collapse or expand all">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="7 15 12 20 17 15"/><polyline points="7 9 12 4 17 9"/></svg>
                            </button>
                            <button class="btn btn-primary" id="addSongBtn">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                Add Song
                            </button>
                        </div>
                    </div>
                    <div id="songList" class="song-list">
                        <!-- Songs will be added here dynamically -->
                    </div>
                </div>
            </div>

            <!-- Right Panel: Preview -->
            <div class="preview-sticky">
                <div class="card">
                    <div class="card-head">
                        <h2>Preview</h2>
                        <button class="btn btn-success" id="downloadBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                            Download Image
                        </button>
                    </div>
                    <div id="canvas-container">
                        <canvas id="previewCanvas" width="1920" height="1080"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
