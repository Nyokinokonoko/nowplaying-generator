<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NowPlaying Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">NowPlaying Generator</span>
            <div class="d-flex align-items-center">
                <span class="navbar-text me-3">local-dev</span>
                <a href="https://github.com/Nyokinokonoko/nowplaying-generator" target="_blank" class="text-white" title="View on GitHub">
                    <i class="bi bi-github fs-4"></i>
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        <div class="row">
            <!-- Left Panel: Controls -->
            <div class="col-md-5 col-lg-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Settings</h5>
                        
                        <!-- Global Settings -->
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" id="imageTitle" value="MAIN TITLE">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Subtitle</label>
                            <input type="text" class="form-control" id="imageSubtitle" value="Subtitle text here">
                        </div>

                        <hr>

                        <!-- Images -->
                        <div class="mb-3">
                            <label class="form-label">Cover Art (Square)</label>
                            <div class="drop-zone" id="coverDropZone">
                                <p class="mb-0 text-muted">Drag & drop or click</p>
                                <input type="file" accept="image/*" id="coverInput">
                                <img id="coverPreview" class="drop-zone-preview">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Backdrop (1920x1080)</label>
                            <div class="drop-zone" id="backdropDropZone">
                                <p class="mb-0 text-muted">Drag & drop or click</p>
                                <input type="file" accept="image/*" id="backdropInput">
                                <img id="backdropPreview" class="drop-zone-preview">
                            </div>
                        </div>

                        <hr>

                        <!-- Song List -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h6 class="mb-0">Song List</h6>
                            <button class="btn btn-sm btn-primary" id="addSongBtn">
                                <i class="bi bi-plus-lg"></i> Add Song
                            </button>
                        </div>

                        <div id="songList" class="list-group mb-3">
                            <!-- Songs will be added here dynamically -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Preview -->
            <div class="col-md-7 col-lg-8">
                <div class="sticky-top" style="top: 20px;">
                    <div class="card shadow-sm">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0">Preview</h5>
                            <button class="btn btn-success" id="downloadBtn">
                                <i class="bi bi-download"></i> Download Image
                            </button>
                        </div>
                        <div class="card-body p-0 bg-dark">
                             <div id="canvas-container">
                                 <canvas id="previewCanvas" width="1920" height="1080"></canvas>
                             </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.14.0/Sortable.min.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
